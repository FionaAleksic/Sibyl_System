name: Managed assets security candidate

on:
  push:
    branches: [feature/managed-assets-security-20261014]
    paths:
      - '.github/workflows/managed-assets-candidate.yml'
      - 'backend/**'
      - 'frontend-v2/**'
      - 'collectors/**'

permissions:
  contents: write

concurrency:
  group: managed-assets-candidate
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_USER: sibyl
          MYSQL_PASSWORD: ci-only-do-not-use
          MYSQL_DATABASE: sibyl
        ports: [3306:3306]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SIBYL_DB_URL: jdbc:mysql://127.0.0.1:3306/sibyl?sslMode=REQUIRED&connectionTimeZone=UTC
      SIBYL_DB_USER: sibyl
      SIBYL_DB_PASSWORD: ci-only-do-not-use
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify MySQL Flyway and Java security
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify React TypeScript build
        working-directory: frontend-v2
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Package checksummed prerelease
        run: |
          set -euo pipefail
          python3 -m py_compile collectors/linux/sibyl-collector.py
          mkdir -p release
          cp backend/target/sibyl-core-0.1.0-SNAPSHOT.jar release/sibyl-core-0.1.0-rc.19-dev.1.jar
          cp collectors/linux/sibyl-collector.py release/sibyl-collector-linux.py
          (cd frontend-v2/dist && zip -qr "$GITHUB_WORKSPACE/release/sibyl-frontend-v2-rc19.zip" .)
          (cd release && sha256sum *.jar *.zip *.py > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish development release (immutable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.1.0-rc.19-dev.1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable tag already exists; refuse overwrite" >&2
            exit 1
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease \
            --title "Sibyl managed network inventory pilot" \
            --notes "Experimental, not production-ready. Flyway V5 modifies schema and MUST NOT be deployed to an existing database without verified off-VM backup and restore drill. Collector keys require explicit secret provisioning, approved network scopes, trusted TLS and access controls."
