name: Backend v2 capability CI
on:
  push:
    branches: [feature/deck-inspired-v2]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/backend-v2-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-v2-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_USER: sibyl
          MYSQL_PASSWORD: ci-only-do-not-use
          MYSQL_DATABASE: sibyl
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SIBYL_DB_URL: jdbc:mysql://127.0.0.1:3306/sibyl?sslMode=REQUIRED&connectionTimeZone=UTC
      SIBYL_DB_USER: sibyl
      SIBYL_DB_PASSWORD: ci-only-do-not-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Validate core-managed Addon Browser JS
        run: |
          node --check frontend/addons.js
          node --check frontend/admin.js
          node --check frontend/login.js
          node --check frontend/sibyl.js
      - name: Test Sibyl backend and capability registry
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify
