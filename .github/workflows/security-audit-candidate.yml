name: Sibyl security candidate (MySQL)

on:
  push:
    branches: [feature/security-audit-rbac-20261014]
    paths:
      - 'backend/**'
      - '.github/workflows/security-audit-candidate.yml'

permissions:
  contents: write

concurrency:
  group: sibyl-security-candidate-rc18-dev1
  cancel-in-progress: false

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_USER: sibyl
          MYSQL_PASSWORD: ci-only-do-not-use
          MYSQL_DATABASE: sibyl
        ports: [3306:3306]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SIBYL_DB_URL: jdbc:mysql://127.0.0.1:3306/sibyl?sslMode=REQUIRED&connectionTimeZone=UTC
      SIBYL_DB_USER: sibyl
      SIBYL_DB_PASSWORD: ci-only-do-not-use
      CANDIDATE_VERSION: 0.1.0-rc.18-dev.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify security permissions, MySQL and authenticated E2E
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Package immutable candidate
        run: |
          set -euo pipefail
          mkdir -p release
          cp backend/target/sibyl-core-0.1.0-SNAPSHOT.jar "release/sibyl-core-${CANDIDATE_VERSION}.jar"
          python3 - "release/sibyl-core-${CANDIDATE_VERSION}.jar" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=set(z.namelist())
              required=[
                  'BOOT-INF/classes/org/sibyl/core/CorePermissions.class',
                  'BOOT-INF/classes/org/sibyl/core/SibylAuditController.class',
                  'BOOT-INF/classes/db/migration/V4__extension_records.sql',
              ]
              for name in required:
                  assert name in names, name
          PY
          (cd release && sha256sum *.jar > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish prerelease (never overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${CANDIDATE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to replace immutable candidate: $tag" >&2
            exit 1
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease \
            --title "Sibyl Core $tag — security pilot" \
            --notes "Audit+RBAC lab-only candidate. No production rollout. Existing Core schema V1–V4 unchanged. Verify DB backup, auth/403 checks, artifact digest and rollback."
