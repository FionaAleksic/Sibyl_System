name: Sibyl audited frontend candidate

on:
  push:
    branches: [feature/security-audit-rbac-20261014]
    paths:
      - '.github/workflows/security-frontend-release.yml'

permissions:
  contents: write

jobs:
  build-audited-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and typecheck V2 React
        working-directory: frontend-v2
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Package independent V2 frontend with checksum
        run: |
          set -euo pipefail
          mkdir -p release
          test -f frontend-v2/dist/index.html
          test -f frontend-v2/dist/login.css
          (cd frontend-v2/dist && zip -qr "$GITHUB_WORKSPACE/release/sibyl-frontend-v2-dist.zip" .)
          (cd release && sha256sum *.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish immutable laboratory UI prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.1.0-rc.18-ui.1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to replace already published frontend artifact" >&2
            exit 1
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease \
            --title "Sibyl React frontend security audit pilot" \
            --notes "Isolated UI candidate for Rocky Linux pilot. Audit menu only for server-authorized admin/auditor roles. Not production-approved."
