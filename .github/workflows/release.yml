name: Build & Publish Sibyl Core Release

on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without leading v (e.g. 0.1.0-rc.2)"
        required: true
        type: string
      channel:
        description: "stable requires main; prerelease requires test"
        required: true
        type: choice
        options: [prerelease, stable]

permissions:
  contents: write

concurrency:
  group: sibyl-core-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sibyl
          POSTGRES_PASSWORD: ci-only-do-not-use
          POSTGRES_DB: sibyl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sibyl -d sibyl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SIBYL_DB_URL: jdbc:postgresql://127.0.0.1:5432/sibyl
      SIBYL_DB_USER: sibyl
      SIBYL_DB_PASSWORD: ci-only-do-not-use
    steps:
      - name: Validate release branch and version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && '0.1.0-rc.2' || inputs.version }}
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'prerelease' || inputs.channel }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || exit 1
          if [[ "$RELEASE_CHANNEL" == stable ]]; then
            [[ "$RELEASE_REF" == main && "$RELEASE_VERSION" != *-* ]] || exit 1
          else
            [[ "$RELEASE_REF" == test && "$RELEASE_VERSION" == *-* ]] || exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test PostgreSQL migration, admin login and configuration API
        run: |
          set -euo pipefail
          node --check frontend/addons.js
          node --check frontend/admin.js
          node --check frontend/sibyl.js
          bash -n deploy/standard/install-ubuntu-2404.sh
          (cd backend && mvn --batch-mode --no-transfer-progress clean verify)
      - name: Create immutable versioned release artifacts
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && '0.1.0-rc.2' || inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp backend/target/sibyl-core-*.jar "dist/sibyl-core-$RELEASE_VERSION.jar"
          cp deploy/standard/install-ubuntu-2404.sh "dist/install-sibyl-ubuntu-2404.sh"
          cp docs/STANDARD-INSTALLATION.md "dist/STANDARD-INSTALLATION.md"
          cp docs/RELEASE-POLICY.md "dist/RELEASE-POLICY.md"
          (cd dist && sha256sum *.jar *.sh *.md > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish prerelease or stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event_name == 'push' && '0.1.0-rc.2' || inputs.version }}
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'prerelease' || inputs.channel }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || exit 1
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable release $tag already exists; refusing overwrite"
            exit 1
          fi
          if [[ "$RELEASE_CHANNEL" == prerelease ]]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease --title "Sibyl Core $tag – PostgreSQL Standard Install" --generate-notes
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Sibyl Core $tag" --generate-notes
          fi
