name: Build & Publish Sibyl Core Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without leading v, e.g. 0.1.0-rc.1"
        required: true
        type: string
      channel:
        description: "stable requires main; prerelease requires test"
        required: true
        type: choice
        options:
          - prerelease
          - stable

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch, version and channel
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && '0.1.0-rc.1' || inputs.version }}
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'prerelease' || inputs.channel }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || { echo "Invalid SemVer"; exit 1; }
          if [[ "$RELEASE_CHANNEL" == stable ]]; then
            [[ "$RELEASE_REF" == main && "$RELEASE_VERSION" != *-* ]] || { echo "Stable release requires main and stable SemVer"; exit 1; }
          else
            [[ "$RELEASE_REF" == test && "$RELEASE_VERSION" == *-* ]] || { echo "Pre-release requires test and prerelease SemVer"; exit 1; }
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify web assets and API tests
        run: |
          set -euo pipefail
          node --check frontend/addon-browser.js
          cd backend
          mvn --batch-mode --no-transfer-progress clean verify
      - name: Create release archive
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && '0.1.0-rc.1' || inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp backend/target/sibyl-core-*.jar "dist/sibyl-core-$RELEASE_VERSION.jar"
          cp docs/RELEASE-POLICY.md dist/RELEASE-POLICY.md
          (cd dist && sha256sum "sibyl-core-$RELEASE_VERSION.jar" > SHA256SUMS.txt)
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event_name == 'push' && '0.1.0-rc.1' || inputs.version }}
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'prerelease' || inputs.channel }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || { echo "Invalid SemVer: refusing tag creation"; exit 1; }
          [[ "$RELEASE_VERSION" != "0.1.0-SNAPSHOT" ]] || exit 1
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Tag already released; refuse overwrite"
            exit 1
          fi
          if [[ "$RELEASE_CHANNEL" == prerelease ]]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease --title "Sibyl Core $tag" --generate-notes
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Sibyl Core $tag" --generate-notes
          fi
