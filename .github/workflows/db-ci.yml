name: Sibyl Core MySQL integration tests

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_USER: sibyl
          MYSQL_PASSWORD: ci-only-do-not-use
          MYSQL_DATABASE: sibyl
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SIBYL_DB_URL: jdbc:mysql://127.0.0.1:3306/sibyl?sslMode=REQUIRED&connectionTimeZone=UTC
      SIBYL_DB_USER: sibyl
      SIBYL_DB_PASSWORD: ci-only-do-not-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify browser JavaScript
        run: |
          node --check frontend/addons.js
          node --check frontend/admin.js
          node --check frontend/sibyl.js
      - name: Validate standard DB installer shell syntax
        run: |
          bash -n deploy/standard/install-ubuntu-2404.sh
          bash -n deploy/cluster3/activate-mysql-core.sh
      - name: Migrate database and exercise login, reset, and configuration APIs
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify
