name: Sibyl Core PostgreSQL integration tests

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sibyl
          POSTGRES_PASSWORD: ci-only-do-not-use
          POSTGRES_DB: sibyl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sibyl -d sibyl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SIBYL_DB_URL: jdbc:postgresql://127.0.0.1:5432/sibyl
      SIBYL_DB_USER: sibyl
      SIBYL_DB_PASSWORD: ci-only-do-not-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify browser JavaScript
        run: |
          node --check frontend/addons.js
          node --check frontend/admin.js
          node --check frontend/sibyl.js
      - name: Validate standard DB installer shell syntax
        run: bash -n deploy/standard/install-ubuntu-2404.sh
      - name: Migrate database and exercise login, reset, and configuration APIs
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify
