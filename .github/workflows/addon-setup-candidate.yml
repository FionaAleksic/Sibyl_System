name: Publish Sibyl Core addon-setup candidate

on:
  push:
    branches: [feature/deck-inspired-v2]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/addon-setup-candidate.yml'
permissions:
  contents: write
concurrency:
  group: sibyl-addon-setup-candidate-rc17-dev1
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_USER: sibyl
          MYSQL_PASSWORD: ci-only-do-not-use
          MYSQL_DATABASE: sibyl
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SIBYL_DB_URL: jdbc:mysql://127.0.0.1:3306/sibyl?sslMode=REQUIRED&connectionTimeZone=UTC
      SIBYL_DB_USER: sibyl
      SIBYL_DB_PASSWORD: ci-only-do-not-use
      CANDIDATE_VERSION: 0.1.0-rc.17-dev.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify browser scripts and backend tests
        run: |
          set -euo pipefail
          node --check frontend/addons.js
          node --check frontend/admin.js
          node --check frontend/login.js
          (cd backend && mvn --batch-mode --no-transfer-progress clean verify)
      - name: Validate included frontend and package checksums
        run: |
          set -euo pipefail
          mkdir -p release
          jar="sibyl-core-${CANDIDATE_VERSION}.jar"
          cp backend/target/sibyl-core-0.1.0-SNAPSHOT.jar "release/$jar"
          python3 - "release/$jar" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=set(z.namelist())
              for required in [
                'BOOT-INF/classes/static/addons.js',
                'BOOT-INF/classes/static/admin.js',
                'BOOT-INF/classes/static/sibyl.css',
                'BOOT-INF/classes/org/sibyl/core/AddonConfigTemplates.class',
                'BOOT-INF/classes/catalog/default.json']:
                  assert required in names, required
          PY
          (cd release && sha256sum *.jar > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish immutable development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${CANDIDATE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Candidate $tag already published; preserving immutability"
            exit 0
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease \
            --title "Sibyl Core $tag · Addon setup candidate" \
            --notes "Development candidate from reviewed feature branch for lab validation of automated verified add-on install, dependency resolution and configuration scaffolding. Not a stable release; do not promote without backup and end-to-end tests."
