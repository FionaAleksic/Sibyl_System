spring:
  application:
    name: sibyl-core
  datasource:
    url: ${SIBYL_DB_URL:jdbc:mysql://127.0.0.1:3306/sibyl?sslMode=REQUIRED&connectionTimeZone=UTC}
    username: ${SIBYL_DB_USER:sibyl}
    password: ${SIBYL_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 8000
  flyway:
    enabled: true
    baseline-on-migrate: false
  web:
    resources:
      cache:
        period: 0
management:
  endpoints:
    web:
      exposure:
        include: health
server:
  address: ${SIBYL_LISTEN_ADDRESS:127.0.0.1}
  port: ${SIBYL_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    root: INFO
