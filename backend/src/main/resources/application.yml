spring:
  application:
    name: sibyl-core
  web:
    resources:
      cache:
        period: 0
management:
  endpoints:
    web:
      exposure:
        include: health
server:
  address: ${SIBYL_LISTEN_ADDRESS:127.0.0.1}
  port: ${SIBYL_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    root: INFO
